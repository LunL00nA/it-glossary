<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わたしのIT用語集</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #222222;
      --sub: #666666;
      --accent: #3b6fd8;
      --border: #e2e6ee;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1b1d22;
        --card: #262a31;
        --text: #eceef2;
        --sub: #aab0bb;
        --accent: #7aa7ff;
        --border: #3a3f49;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      line-height: 1.8;
      font-size: 16px;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    header h1 {
      font-size: 1.6rem;
      margin: 8px 0 4px;
    }
    header p {
      margin: 0 0 24px;
      color: var(--sub);
      font-size: 0.95rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .card h2 {
      font-size: 1.2rem;
      margin: 0 0 6px;
      color: var(--accent);
    }
    .card p {
      margin: 0;
      word-break: break-word;
    }
    .empty {
      color: var(--sub);
      text-align: center;
      padding: 32px 0;
    }
    footer {
      margin-top: 32px;
      color: var(--sub);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>わたしのIT用語集</h1>
      <p>IT用語を、やさしい言葉で自分のペースに合わせて整理します。</p>
    </header>

    <main id="term-list"></main>

    <footer>用語は <code>index.html</code> の <code>terms</code> に追加できます。</footer>
  </div>

  <script>
    // ===== 用語の一覧 =====
    // 新しい用語は、下の { ... } の形で「,」を付けて追加してください。
    //   { name: "用語名", description: "やさしい説明（1〜2文）" },
    const terms = [
      {
        name: "Git",
        description: "ファイルの変更履歴を記録・管理するためのしくみ（ソフトウェア）です。いつ、何を変えたかを残しておけるので、前の状態に戻すこともできます。"
      },
      {
        name: "GitHub",
        description: "Gitで管理しているファイルを、インターネット上に保存して共有できるサービスです。複数人で同じファイルを一緒に作業するときにも使われます。"
      },
      {
        name: "リポジトリ",
        description: "プログラムやファイルを、変更履歴ごとまとめて保存しておく場所（フォルダ）のことです。Gitで管理されたフォルダを指すことが多いです。"
      },
      {
        name: "コミット",
        description: "Gitで、ファイルの変更内容を履歴として記録することです。「何を、なぜ変えたか」を短いメッセージと一緒に残せるので、あとから振り返ったり元に戻したりできます。"
      }
    ];

    // ===== 画面への表示 =====
    function render() {
      const list = document.getElementById("term-list");
      list.innerHTML = "";

      if (terms.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "まだ用語がありません。";
        list.appendChild(empty);
        return;
      }

      terms.forEach(function (term) {
        const card = document.createElement("article");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = term.name;

        const desc = document.createElement("p");
        desc.textContent = term.description;

        card.appendChild(title);
        card.appendChild(desc);
        list.appendChild(card);
      });
    }

    render();
  </script>
</body>
</html>
